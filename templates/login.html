{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm border-0"><div class="card-body p-4">
    <h3 class="mb-3">Log in</h3>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" required></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required></div>
      <button class="btn btn-brand w-100">Log in</button>
    </form>
    <p class="mt-3 mb-0 small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div></div>
</div></div>
{% endblock %}
